packages:
  - "apps/*"
  # Expo/Metro resolves modules by walking real directories, which pnpm's
  # symlinked store breaks. apps/partner and apps/customer are standalone npm projects instead —
  # run npm commands from inside those directories, not pnpm from the root.
  - "!apps/partner"
  - "!apps/customer"
  - "packages/*"
  - "supabase/seed"
